<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Blank Template for Bootstrap</title>
        <!-- Bootstrap core CSS -->
        <link href="bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css">
        <!-- Custom styles for this template -->
        <link href="style.css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=League+Spartan&display=swap">
    </head>
    <body>
        <div class="row">
            <img src="images/letoTKDlogo.webp" class="d-block welcome-logo mx-auto w-auto">
        </div>
        <!-- Bootstrap core JavaScript
    ================================================== -->
        <!-- Placed at the end of the document so the pages load faster -->
        <div class="stepper">
            <div class="step">
                <div class="step-circle">
                    <p>1</p>
                </div>
                <div class="step-label active">
                    <p>Welcome</p>
                </div>
            </div>
            <div class="step">
                <div class="step-circle inactive">
                    <p>2</p>
                </div>
                <div class="step-label">
                    <p>Student<br> Information</p>
                </div>
            </div>
            <div class="step">
                <div class="step-circle inactive">
                    <p>3</p>
                </div>
                <div class="step-label">
                    <p>Concent &<br> Waiver</p>
                </div>
            </div>
            <div class="step">
                <div class="step-circle inactive">
                    <p>4</p>
                </div>
                <div class="step-label">
                    <p>Review &<br> Submit</p>
                </div>
            </div>
        </div>
        <div class="welcome-content"> 
            <h1>Welcome!</h1>
            <p>We're excited you're here. Please complete the following information to register your student at Leto Tae Kwon Do.</p>
        </div>
        <div class="info-box">
</div>
        <script src="assets/js/popper.min.js"></script>
        <script src="bootstrap/js/bootstrap.min.js"></script>
    </body>
</html>
