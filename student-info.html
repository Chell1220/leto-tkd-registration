<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Blank Template for Bootstrap</title>
        <!-- Bootstrap core CSS -->
        <link href="bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css">
        <!-- Custom styles for this template -->
        <link href="style.css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=League+Spartan&display=swap">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="row">
            <img src="images/letoTKDlogo.webp" class="d-block welcome-logo mx-auto w-auto">
        </div>
        <!-- Bootstrap core JavaScript
    ================================================== -->
        <!-- Placed at the end of the document so the pages load faster -->
        <div class="stepper">
            <div class="step">
                <div class="step-circle complete">
                    <p><i class="bi bi-check-lg"></i></p>
                </div>
                <div class="step-label inactive">
                    <p>Welcome</p>
                </div>
            </div>
            <div class="step">
                <div class="step-circle active">
                    <p>2</p>
                </div>
                <div class="step-label active">
                    <p>Student<br> Information</p>
                </div>
            </div>
            <div class="step">
                <div class="step-circle inactive">
                    <p>3</p>
                </div>
                <div class="step-label inactive">
                    <p>Consent &<br> Waiver</p>
                </div>
            </div>
            <div class="step">
                <div class="step-circle inactive">
                    <p>4</p>
                </div>
                <div class="step-label inactive">
                    <p>Review &<br> Submit</p>
                </div>
            </div>
        </div>
        <div class="student-form">
            <h1>Student Information</h1>
            <p class="form-intro"> Please enter the student's information below.</p>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" placeholder="First Name*">
                </div>
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" placeholder="Last Name*">
                </div>                 
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" placeholder="Date of Birth*">
                </div>
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" placeholder="Gender Select">
                </div>                 
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" placeholder="Parent/Guardian Name*">
                </div>
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" placeholder="Phone Number*">
                </div>                 
            </div>
            <div class="row">
                <div class="col-md-12 mb-3">
                    <input type="text" class="form-control" placeholder="Email Address">
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mb-3">
                    <input type="text" class="form-control" placeholder="Mailing Address*">
                </div>
            </div>
        </div>         
        <div class="student-nav-buttons">
            <a href="welcome.html" class="btn register-btn back"><i class="bi bi-arrow-left"></i>Back </a>
            <button type="button" class="btn register-btn next">Next<i class="bi bi-arrow-right"></i>
            </button>
        </div>
        <script src="assets/js/popper.min.js"></script>
        <script src="bootstrap/js/bootstrap.min.js"></script>
    </body>
</html>
